name: farkha_admin
description: "Farkha Admin Dashboard"
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  flutter_markdown: ^0.7.4
  markdown: ^7.2.2
  get: ^4.7.2
  fl_chart: ^0.69.0
  data_table_2: ^2.5.15
  intl: ^0.20.0
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon_foreground.png"
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - .env
  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Regular.ttf
